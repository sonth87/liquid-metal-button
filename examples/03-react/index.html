<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Ví dụ 3: React Component Demo</title>
  <style>
    body {
      background: #07080b;
      color: #fff;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      margin: 0;
      gap: 20px;
    }
    .card {
      text-align: center;
      padding: 40px 60px;
      border: 1px solid rgba(255, 255, 255, 0.1);
      border-radius: 16px;
      background: rgba(255, 255, 255, 0.02);
      backdrop-filter: blur(10px);
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 16px;
    }
    h1 { margin: 0; font-size: 22px; font-weight: 600; }
    p { margin: 0; color: #888; font-size: 14px; }
    .badge {
      background: rgba(0, 255, 204, 0.1);
      color: #00ffcc;
      border: 1px solid rgba(0, 255, 204, 0.2);
      padding: 4px 12px;
      border-radius: 999px;
      font-size: 12px;
    }
  </style>

  <!-- React 18 & Babel Standalone để chạy JSX trực tiếp không cần build -->
  <script src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
  <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>

  <!-- WebGL Liquid Button Standalone -->
  <script src="../../src/standalone/liquid-button-standalone.js"></script>
</head>
<body>

  <div id="root"></div>

  <script type="text/babel">
    function ReactApp() {
      const [count, setCount] = React.useState(0);
      const [loading, setLoading] = React.useState(false);

      const handleCheckout = () => {
        setLoading(true);
        setTimeout(() => {
          setCount((prev) => prev + 1);
          setLoading(false);
          console.log('Checkout completed');
        }, 800);
      };

      return (
        <div className="card">
          <span className="badge">React 18 Live Demo</span>
          <h1>React Component Integration</h1>
          <p>Số lần đã click trong React State: <strong style={{ color: '#00ffcc' }}>{count}</strong></p>

          <liquid-button
            height="56"
            radius="16px"
            padding-x="32px"
            color="#00ffcc"
            border-color="rgba(0, 255, 204, 0.35)"
            btn-bg="#031514"
            fluid-color1="#00f5d4"
            fluid-color2="#013a36"
            gap="10px"
            disabled={loading || undefined}
            onClick={handleCheckout}
          >
            <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2">
              <circle cx="9" cy="21" r="1"></circle>
              <circle cx="20" cy="21" r="1"></circle>
              <path d="M1 1h4l2.68 13.39a2 2 0 0 0 2 1.61h9.72a2 2 0 0 0 2-1.61L23 6H6"></path>
            </svg>
            <span style={{ fontWeight: 600 }}>
              {loading ? 'Processing...' : 'Checkout Now ($49)'}
            </span>
          </liquid-button>
        </div>
      );
    }

    ReactDOM.createRoot(document.getElementById('root')).render(<ReactApp />);
  </script>
</body>
</html>
