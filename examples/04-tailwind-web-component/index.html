<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Ví dụ 4: Web Component với Tailwind CSS</title>
  <!-- Nhúng Tailwind CSS Play CDN để kiểm tra thực tế -->
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-black text-white min-h-screen flex flex-col items-center justify-center p-6 gap-6">

  <div class="text-center max-w-lg">
    <h1 class="text-2xl font-bold mb-2">Tailwind CSS + &lt;liquid-button&gt;</h1>
    <p class="text-neutral-400 text-sm">
      Sử dụng trực tiếp các class quen thuộc của Tailwind CSS (<code class="text-amber-400">h-14</code>, <code class="text-amber-400">rounded-2xl</code>, <code class="text-amber-400">px-8</code>, <code class="text-amber-400">bg-neutral-900</code>) và các thuộc tính chuẩn HTML.
    </p>
  </div>

  <div class="flex flex-wrap gap-4 items-center justify-center">
    <!-- Nút 1: Vàng Gold với Tailwind class -->
    <liquid-button
      class="h-14 px-8 rounded-2xl bg-neutral-900 border border-yellow-500/40 text-yellow-400 font-semibold text-sm gap-3"
      style="--fluid-1: #ffaa00; --fluid-2: #3a2500; --rim: #ffd700;"
      onclick="console.log('Selected plan:', this.dataset.plan)"
      data-plan="enterprise"
      title="Enterprise Plan"
    >
      <svg class="w-5 h-5" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
        <polygon points="12 2 15.09 8.26 22 9.27 17 14.14 18.18 21.02 12 17.77 5.82 21.02 7 14.14 2 9.27 8.91 8.26 12 2"></polygon>
      </svg>
      <span>Enterprise</span>
    </liquid-button>

    <!-- Nút 2: Nút Tím Neon -->
    <liquid-button
      class="h-14 px-7 rounded-xl bg-neutral-950 border border-fuchsia-500/40 text-fuchsia-300 font-medium text-sm gap-2"
      style="--fluid-1: #d946ef; --fluid-2: #4a044e; --rim: #f0abfc;"
      onclick="console.log('Button clicked')"
    >
      <svg class="w-4 h-4" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
        <path d="m13 2-2 2.5h3L11 8"></path>
        <polygon points="13 2 3 14 12 14 11 22 21 10 12 10 13 2"></polygon>
      </svg>
      <span>Upgrade</span>
    </liquid-button>

    <!-- Nút 3: Disabled state -->
    <liquid-button
      class="h-14 px-6 rounded-xl bg-neutral-900 border border-white/10 text-neutral-500 text-sm"
      disabled
      onclick="console.log('Disabled button clicked')"
      title="Disabled"
    >
      <span>Disabled</span>
    </liquid-button>
  </div>

  <!-- Nhúng Web Component script (hoạt động trực tiếp cả file:// lẫn http://) -->
  <script src="../../src/standalone/liquid-button-standalone.js"></script>
</body>
</html>
