<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Ví dụ 1: HTML Tĩnh Standalone</title>
  <style>
    body {
      background: #090a0f;
      color: #fff;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      margin: 0;
      gap: 20px;
    }
    h1 { margin: 0; font-size: 24px; font-weight: 600; }
    p { margin: 0 0 20px; color: #888; font-size: 14px; }
  </style>
</head>
<body>

  <h1>Ví dụ HTML thuần - Chỉ cần 1 file duy nhất</h1>
  <p>Nhúng trực tiếp <code>liquid-button-standalone.js</code>, không cần cài đặt bất kỳ công cụ nào.</p>

  <!-- Nút có Icon SVG và nội dung slot -->
  <liquid-button
    height="56"
    radius="14px"
    padding-x="30px"
    color="#00ffff"
    border-color="rgba(0, 255, 255, 0.35)"
    btn-bg="#04141d"
    fluid-color1="#00f0ff"
    fluid-color2="#002b4d"
    onclick="console.log('Button clicked')"
  >
    <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
      <path d="M5 12h14"></path>
      <path d="m12 5 7 7-7 7"></path>
    </svg>
    <span>Get Started</span>
  </liquid-button>

  <!-- Script standalone -->
  <script src="../../src/standalone/liquid-button-standalone.js"></script>
</body>
</html>
